<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#242c2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cleaning Club">
  <link rel="manifest" href="game.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-180.png">
  <title>Cleaning Club | Family Arcade</title>
  <link rel="stylesheet" href="../../arcade.css">
  <link rel="stylesheet" href="game.css">
  <link rel="preload" as="image" type="image/webp" href="assets/scenes/bath.webp">
  <script defer src="audio.js"></script>
  <script defer src="foley.js"></script>
  <script defer src="cleaning-effects.js"></script>
  <script defer src="cleaning.js"></script>
  <script defer src="bathtub.js"></script>
  <script defer src="levels/surfaces.js"></script>
  <script defer src="levels/vanity.js"></script>
  <script defer src="levels/bedroom.js"></script>
  <script defer src="levels/playroom.js"></script>
  <script defer src="levels/workrooms.js"></script>
  <script defer src="levels/finale.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
<main id="game">
  <header class="game-bar">
    <a class="control back" href="../../" aria-label="Back to Family Arcade">← <span>Arcade</span></a>
    <div class="level-heading">
      <span id="levelTag" class="level-tag">Level 1 of 10</span>
      <h1 id="levelTitle">Bathtub Bliss</h1>
    </div>
    <div class="stats">
      <div role="progressbar" aria-label="Cleanliness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><div id="fill"></div></div>
      <span id="progressLabel">✨ 0% clean</span>
    </div>
    <details class="menu" id="levelMenu">
      <summary class="control">Levels</summary>
      <nav class="menu-panel" aria-label="Levels">
        <div class="level-list" id="levelList"></div>
      </nav>
    </details>
    <button class="control" id="sound" aria-pressed="false">Sound off</button>
    <details class="menu" id="taskMenu">
      <summary class="control">Tasks</summary>
      <section class="menu-panel task-panel" aria-label="Tasks and settings">
        <p id="levelDescription">Soften the soap scum, brush the grout and polish the taps.</p>
        <p class="tip" id="tip" role="status"></p>
        <ul class="tasks" id="tasks" aria-label="Cleaning tasks"></ul>
        <div class="task-footer">
          <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="24"></label>
          <span id="timeLabel">⏱ 0:00</span>
        </div>
      </section>
    </details>
  </header>
  <p id="audioWarning" class="tip audio-warning hidden" role="status"></p>
  <div class="stage">
    <div class="scene" id="scene">
      <img id="scenePainting" alt="" aria-hidden="true" class="hidden" draggable="false" decoding="async" fetchpriority="high">
      <svg id="sceneArt" viewBox="0 0 960 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustrated cleaning scene"></svg>
      <canvas id="dirtCanvas" width="960" height="620" aria-label="Drag a finger to clean the dirty areas"></canvas>
      <canvas id="fxCanvas" width="960" height="620" aria-hidden="true"></canvas>
      <span id="dirtHint" class="dirt-hint hidden" aria-hidden="true"></span>
      <span class="cursor hidden" id="cursor" aria-hidden="true">🧽</span>
      <div class="finish hidden" id="finish">
        <h2 id="finishTitle">So satisfying!</h2>
        <p id="finishMessage">Everything is sparkling clean.</p>
        <div class="finish-actions">
          <button class="primary" id="next">Next makeover →</button>
          <button class="secondary" id="again">Clean this scene again</button>
        </div>
      </div>
    </div>
  </div>
  <div class="tools" aria-label="Cleaning tools">
    <button class="tool" data-tool="spray" aria-pressed="false"><span class="emoji" aria-hidden="true">🫧</span><span>Foam spray<small>Softens soap scum</small></span></button>
    <button class="tool" data-tool="sponge" aria-pressed="false"><span class="emoji" aria-hidden="true">🧽</span><span>Sponge<small>Wipes and polishes</small></span></button>
    <button class="tool" data-tool="brush" aria-pressed="false"><span class="emoji" aria-hidden="true">🪥</span><span>Detail brush<small>Scrubs the grout</small></span></button>
  </div>
</main>
</body>
</html>
