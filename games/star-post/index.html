<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181832">
<title>Star Post — Family Arcade Prototype</title>
<link rel="stylesheet" href="game.css">
<script type="module" src="game.js"></script>
</head>
<body>
<main class="shell">
<header class="bar">
  <a class="back" href="../../" aria-label="Return to Family Arcade">← Arcade</a>
  <div class="identity"><span class="eyebrow">FAMILY ARCADE · PROTOTYPE</span><h1>✦ Star Post</h1></div>
  <button id="restart" class="small" type="button">↻ Restart</button>
</header>
<section class="game" aria-labelledby="levelTitle">
  <div class="info"><div><span id="counter" class="eyebrow">Level 1 / 5</span><h2 id="levelTitle">First Delivery</h2><p id="subtitle"></p></div><div class="progress" id="progress" aria-live="polite"></div></div>
  <svg id="board" viewBox="0 0 960 560" role="group" aria-label="Move each coloured star into its matching glowing home; avoid clouds" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="sky"><stop stop-color="#38335f"/><stop offset="1" stop-color="#16172f"/></radialGradient>
      <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect width="960" height="560" fill="url(#sky)"/>
    <g id="background" aria-hidden="true"></g><g id="clouds" aria-hidden="true"></g>
    <g id="targets"></g><g id="stars"></g>
  </svg>
  <div id="finish" class="finish hidden" role="status">
    <div class="medal">✦</div><h2 id="finishTitle">Wonderful!</h2>
    <p id="finishMessage">All the stars are home.</p>
    <button id="next" class="next" type="button">Next delivery →</button>
  </div>
</section>
<footer class="foot">
  <p id="status" role="status">Drag a star to its matching glowing circle. You can also tap a star, then its home.</p>
  <div class="level-buttons"><label for="levelSelect">Level</label><select id="levelSelect" aria-label="Choose unlocked level"></select></div>
</footer>
</main>
</body>
</html>
